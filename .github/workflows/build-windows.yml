name: Windows-Installer bauen
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Projekt aus projekt.zip entpacken
        shell: pwsh
        run: |
          if (-not (Test-Path projekt.zip)) { Write-Error "projekt.zip fehlt im Repository. Bitte die Datei projekt.zip hochladen."; exit 1 }
          Expand-Archive -Path projekt.zip -DestinationPath . -Force
          Get-ChildItem -Recurse src-tauri | Select-Object -First 30 FullName
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: "src-tauri" }
      - run: npm install
      - run: npm test
      - run: npm run icons
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: IBIS-IV-Setup
          path: src-tauri/target/release/bundle/nsis/*.exe
