name: Windows-Installer bauen
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Projekt aus projekt.zip entpacken
        shell: pwsh
        run: |
          if (-not (Test-Path projekt.zip)) { Write-Error "projekt.zip fehlt im Repository."; exit 1 }
          Expand-Archive -Path projekt.zip -DestinationPath . -Force
          Remove-Item -Path Cargo.toml, Cargo.lock, build.rs, tauri.conf.json -ErrorAction SilentlyContinue
      - name: FFmpeg herunterladen
        shell: pwsh
        run: |
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip
          Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg-tmp -Force
          New-Item -ItemType Directory -Force -Path src-tauri/binaries | Out-Null
          $exe = Get-ChildItem -Recurse ffmpeg-tmp -Filter ffmpeg.exe | Select-Object -First 1
          Copy-Item $exe.FullName src-tauri/binaries/ffmpeg-x86_64-pc-windows-msvc.exe
          & src-tauri/binaries/ffmpeg-x86_64-pc-windows-msvc.exe -version | Select-Object -First 1
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: "src-tauri" }
      - run: npm install
      - run: npm test
      - run: npm run icons
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: IBIS-IV-Setup
          path: src-tauri/target/release/bundle/nsis/*.exe
